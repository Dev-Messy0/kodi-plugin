name: Extract Cricfy Flux

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install requests
    pip install cryptography
    pip install pycryptodome
    # Vérifier l'installation
    python -c "import requests; print('requests OK')"
    python -c "from cryptography.hazmat.primitives.ciphers import Cipher; print('cryptography OK')"
    python -c "from Crypto.Cipher import AES; print('pycryptodome OK')"

      - name: Run extraction script
        run: |
          cd plugin.video.cricfy
          python extract_flux.py

      - name: Generate cricfy.txt
        run: |
          cd plugin.video.cricfy
          python generate_txt.py

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cricfy-flux
          path: |
            plugin.video.cricfy/cricfy.txt
            plugin.video.cricfy/cricfy.m3u
            plugin.video.cricfy/flux_cricfy.json
            plugin.video.cricfy/flux_cricfy.csv
          retention-days: 7